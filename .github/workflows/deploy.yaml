name: Sausage Store Deploy

on:
  push:
    branches:
      - main

env:
  NEXUS_HELM_REPO: ${{ secrets.NEXUS_HELM_REPO }}
  NEXUS_HELM_REPO_USER: ${{ secrets.NEXUS_HELM_REPO_USER }}
  NEXUS_HELM_REPO_PASSWORD: ${{ secrets.NEXUS_HELM_REPO_PASSWORD }}
  SAUSAGE_STORE_NAMESPACE: r-devops-magistracy-project-2sem-43051836
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  VERSION: "0.1.0"

jobs:

  # Сборка и пуш образов в Docker Hub
  build_and_push_to_docker_hub:
    name: Push Docker images to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Backend to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: omatrenitsky/sausage-backend:latest
          build-args: |
            VERSION=${{ github.sha }}

      - name: Push Frontend to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: omatrenitsky/sausage-frontend:latest

      - name: Push Backend-report to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: ./backend-report/
          push: true
          tags: omatrenitsky/sausage-backend-report:latest

  # Упаковываем Helm chart и пушим его в Nexus
  add_helm_chart_to_nexus:
    name: Add Helm Chart To Nexus
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Build Helm chart dependencies
        run: |
          helm dependency build ./sausage-store-chart

      - name: Package Helm chart
        run: |
          helm package ./sausage-store-chart \
            --version "${{ env.VERSION }}"

      - name: Push chart to Nexus
        run: |
          curl -f -v \
            -u "${{ env.NEXUS_HELM_REPO_USER }}:${{ env.NEXUS_HELM_REPO_PASSWORD }}" \
            --upload-file "sausage-store-${{ env.VERSION }}.tgz" \
            "${{ env.NEXUS_HELM_REPO }}/sausage-store-${{ env.VERSION }}.tgz"

            
  # Деплоим приложения в кластер Kubernetes с помощью helm-чарт
  deploy_helm_chart_to_kubernetes:
    name: Deploy Helm Chart To Kubernetes
    runs-on: ubuntu-latest
    needs: add_helm_chart_to_nexus

    steps:
      - uses: actions/checkout@v3
      
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0
          
      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          chmod 600 kubeconfig
          
      - name: Add Nexus Helm repo
        run: |
          helm repo add nexus ${{ env.NEXUS_HELM_REPO }} \
            --username ${{ env.NEXUS_HELM_REPO_USER }} \
            --password ${{ env.NEXUS_HELM_REPO_PASSWORD }}
          helm repo update
          
      - name: Deploy with Helm
        run: |
          envsubst < ./sausage-store-chart/values.yaml > ./values-resolved.yaml
          helm upgrade --install sausage-store nexus/sausage-store \
            --namespace ${{ env.SAUSAGE_STORE_NAMESPACE }} \
            --values ./values-resolved.yaml \
            --kubeconfig ./kubeconfig

